[package]
name = "leash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Budgeted context for coding agents. Out-of-radius patches don't land."
repository = "https://github.com/getArbor-dev/leash"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "leash"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "leash"
path = "src/main.rs"
